<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#151923">
  <meta name="color-scheme" content="dark light">
  <title>Kali Linux</title>
  <link rel="icon" type="image/svg+xml" href="assets/kali-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cantarell:wght@400;700&family=Fira+Code:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/windows.css">
  <link rel="stylesheet" href="css/phantom.css">
</head>
<body>
  <div id="desktop" class="desktop">
    <div id="wallpaper" class="wallpaper" aria-hidden="true"></div>
    <header id="panel" class="panel" role="toolbar" aria-label="Panel"></header>
    <main id="desktop-icons" class="desktop-icons" aria-label="Desktop"></main>
    <div id="windows" class="windows"></div>
    <div id="notifications" class="notifications" aria-live="polite"></div>
  </div>
  <div id="popups"></div>
  <div id="overlays"></div>
  <noscript><div class="noscript">This desktop needs JavaScript to run.</div></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
